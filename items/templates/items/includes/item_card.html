<article class="card item-card mb-3">
    <div class="card-body">
        <h2 class="h5 card-title">
            {{ item.name|default:"Без названия" }}
        </h2>

        <p class="card-text text-secondary">
            Категория: {{ item.category.name }}
        </p>

        <p class="card-text">
            Остаток: {{ item.quantity }} {{ item.unit }}
            {% include "items/includes/stock_badge.html" %}
        </p>

        <a href="{% url 'items:detail' item.id %}" class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>
