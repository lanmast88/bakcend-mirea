[project]
name = "home-inventory"
version = "0.3.0"
description = "Консольное приложение для учёта товаров в доме"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
home-inventory = "home_inventory.cli:run"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
